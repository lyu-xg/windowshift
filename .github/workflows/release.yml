name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Import signing certificate (optional)
        if: ${{ secrets.APPLE_SIGNING_CERT_P12 != '' }}
        env:
          CERT_P12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          CERT_PASS: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "temp" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "temp" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

      - name: Build universal app bundle
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./build.sh --universal

      - name: Package zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="WindowShift-${TAG}-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent build/WindowShift.app "$ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Notarize and staple (optional)
        if: ${{ secrets.APPLE_SIGNING_CERT_P12 != '' && secrets.APPLE_NOTARY_APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          xcrun notarytool submit "$ARCHIVE" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --wait
          xcrun stapler staple build/WindowShift.app
          rm -f "$ARCHIVE"
          ditto -c -k --sequesterRsrc --keepParent build/WindowShift.app "$ARCHIVE"

      - name: Generate checksum
        run: shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          generate_release_notes: true
