name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Import signing certificate (optional)
        env:
          CERT_P12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          CERT_PASS: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "No APPLE_SIGNING_CERT_P12 secret configured; building ad-hoc signed bundle."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "temp" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "temp" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning

      - name: Build universal app bundle
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./build.sh --universal

      - name: Package zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="WindowShift-${TAG}-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent build/WindowShift.app "$ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Notarize and staple (optional)
        env:
          CERT_P12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "Skipping notarization (no signing certificate)."
            exit 0
          fi
          if [ -n "$KEY_P8" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ]; then
            printf '%s' "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            chmod 600 "$RUNNER_TEMP/notary.p8"
            xcrun notarytool submit "$ARCHIVE" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$KEY_ID" \
              --issuer "$ISSUER_ID" \
              --wait
            rm -f "$RUNNER_TEMP/notary.p8"
          elif [ -n "$APPLE_ID" ] && [ -n "$TEAM_ID" ] && [ -n "$APP_PASSWORD" ]; then
            xcrun notarytool submit "$ARCHIVE" \
              --apple-id "$APPLE_ID" \
              --team-id "$TEAM_ID" \
              --password "$APP_PASSWORD" \
              --wait
          else
            echo "Skipping notarization (no notary credentials configured)."
            exit 0
          fi
          xcrun stapler staple build/WindowShift.app
          xcrun stapler validate build/WindowShift.app
          spctl --assess --type execute -vvv build/WindowShift.app
          rm -f "$ARCHIVE"
          ditto -c -k --sequesterRsrc --keepParent build/WindowShift.app "$ARCHIVE"

      - name: Generate checksum
        run: shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          generate_release_notes: true
