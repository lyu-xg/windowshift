name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run unit tests
        run: swift test

      - name: Import signing certificate (optional)
        env:
          CERT_P12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          CERT_PASS: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "No APPLE_SIGNING_CERT_P12 secret configured; building ad-hoc signed bundle."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "temp" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "temp" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning

      - name: Build universal app bundle
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: ./build.sh --universal

      - name: Package zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="WindowShift-${TAG}-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent build/WindowShift.app "$ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Notarize and staple (optional)
        env:
          CERT_P12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "Skipping notarization (no signing certificate)."
            exit 0
          fi
          if [ -n "$KEY_P8" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ]; then
            printf '%s' "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            chmod 600 "$RUNNER_TEMP/notary.p8"
            xcrun notarytool submit "$ARCHIVE" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$KEY_ID" \
              --issuer "$ISSUER_ID" \
              --wait
            rm -f "$RUNNER_TEMP/notary.p8"
          elif [ -n "$APPLE_ID" ] && [ -n "$TEAM_ID" ] && [ -n "$APP_PASSWORD" ]; then
            xcrun notarytool submit "$ARCHIVE" \
              --apple-id "$APPLE_ID" \
              --team-id "$TEAM_ID" \
              --password "$APP_PASSWORD" \
              --wait
          else
            echo "Skipping notarization (no notary credentials configured)."
            exit 0
          fi
          xcrun stapler staple build/WindowShift.app
          xcrun stapler validate build/WindowShift.app
          spctl --assess --type execute -vvv build/WindowShift.app
          rm -f "$ARCHIVE"
          ditto -c -k --sequesterRsrc --keepParent build/WindowShift.app "$ARCHIVE"

      - name: Generate checksum
        run: |
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "SHA256=$(awk '{print $1}' "${ARCHIVE}.sha256")" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          generate_release_notes: true

      - name: Update Homebrew tap (optional)
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
          SHA256: ${{ env.SHA256 }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "No HOMEBREW_TAP_TOKEN configured; skipping automatic tap update."
            exit 0
          fi
          VER="${VERSION#v}"
          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/lyu-xg/homebrew-tap.git" "$TAP_DIR"
          python3 - "$TAP_DIR/Casks/windowshift.rb" "$VER" "$SHA256" <<'PY'
          import re, sys
          path, ver, sha = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(path).read()
          text = re.sub(r'version "[^"]+"', f'version "{ver}"', text, count=1)
          text = re.sub(r'sha256 [^\n]+', f'sha256 "{sha}"', text, count=1)
          open(path, "w").write(text)
          PY
          git -C "$TAP_DIR" config user.name "github-actions[bot]"
          git -C "$TAP_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$TAP_DIR" add Casks/windowshift.rb
          if ! git -C "$TAP_DIR" diff --cached --quiet; then
            git -C "$TAP_DIR" commit -m "Update windowshift to ${VER}"
            git -C "$TAP_DIR" push origin HEAD:main
          fi
