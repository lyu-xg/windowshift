name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run unit tests
        run: swift test

      - name: Build universal app bundle
        run: ./build.sh --universal

      - name: Verify bundle signature and architectures
        run: |
          codesign --verify --deep --strict build/WindowShift.app
          lipo -info build/WindowShift.app/Contents/MacOS/WindowShift | grep -q "arm64"
          lipo -info build/WindowShift.app/Contents/MacOS/WindowShift | grep -q "x86_64"
